# PnP 用的装甲板四点物理尺寸：宽 = 两灯条中心距，高 = 灯条长度（检测四点是灯条端点）。
# 数值取自同济 sp_vision_25 solver.cpp（小板 135 mm、大板 230 mm、灯条 56 mm；RPS 为 132/230/55）。
# 规则手册未列尺寸，以裁判系统装甲模块说明或实物测量为准，量后直接改这里。
small: {width_m: 0.135, height_m: 0.056}
large: {width_m: 0.230, height_m: 0.056}
# 图像中 灯条中心距 / 平均灯条长度 的初始范围，按本车视角调；重叠区判为歧义，不输出 3D 观测。
small_ratio_range: [1.0, 3.2]
large_ratio_range: [2.8, 5.5]
# label: 0 哨兵 1 英雄 2 工程 3/4/5 步兵 6 前哨站 7 基地。
# 兵种板型按同济 get_type：英雄、基地大板；哨兵、工程、前哨站小板；步兵可能是平衡步兵（大板），按模型或比例判断。
# 2027 实际板型以规则和实车为准。
label_policies:
  0: small
  1: large
  2: small
  3: auto
  4: auto
  5: auto
  6: small
  7: auto
