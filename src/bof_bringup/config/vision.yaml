# Shared by bof_replay --config and ros2 launch ... config:=...
# Model paths and extends are relative to the file declaring them.
schema_version: 1
enemy_color: red
detector_backend: light_pair
model_path: ""
inference_device: CPU
color_threshold: 80
confidence_threshold: 0.7
nms_threshold: 0.3
track_timeout_s: 0.2
association_gate_px: 100.0
track_confirm_frames: 3
track_label_confirm_frames: 3
association_ambiguity_px: 12.0
publish_debug_image: true
# Optional camera-optical PnP. Supply actual calibration and explicit geometry together.
calibration_path: ""
geometry_path: ""
plate_width_m: 0.0
plate_height_m: 0.0
pose_label: -2
max_reprojection_error_px: 4.0
